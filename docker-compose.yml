services:
  db:
    image: postgres:16-alpine
    container_name: mission_critical_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Set POSTGRES_PASSWORD in a root .env for anything beyond local-only use
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    # Bind to localhost only — do not expose Postgres on the LAN
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: mission_critical_ntfy
    restart: unless-stopped
    command: [ "serve" ]
    # LAN-facing for mobile clients; use a unique NTFY_TOPIC (see backend .env)
    ports:
      - "8082:80"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  backend:
    build:
      context: ./ixian-mission-critical-backend
      dockerfile: dockerfile
    container_name: mission_critical_api
    restart: unless-stopped
    # Load ixian-mission-critical-backend/.env into the container. Compose substitution
    # (${VAR}) only reads the repo root .env — it does NOT read this file unless listed here.
    env_file:
      - ./ixian-mission-critical-backend/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      # Do not set BACKEND_CORS_ORIGINS or NTFY_* here for the same reason: compose
      # `environment` overrides env_file. Put CORS and ntfy in ixian-mission-critical-backend/.env
      # (see .env.example: NTFY_URL=http://ntfy:80 for the bundled ntfy service).
      # LAN regex is a homelab convenience; tighten or clear for stricter deploys.
      BACKEND_CORS_ORIGIN_REGEX: ${BACKEND_CORS_ORIGIN_REGEX:-^http://192\.168\.[0-9]+\.[0-9]+:[0-9]+}
    depends_on:
      db:
        condition: service_healthy
      ntfy:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./ixian-mission-critical
      dockerfile: Dockerfile
      args:
        NODE_MEMORY_MB: ${NODE_MEMORY_MB:-2048}
    container_name: mission_critical_web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:80"

volumes:
  postgres_data:
